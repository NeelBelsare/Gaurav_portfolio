<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Jaiswal - Digital Visiting Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .visiting-card {
            width: 100%;
            max-width: 350px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .card-header {
            background: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid white;
            margin: 0 auto 15px;
            object-fit: cover;
        }
        
        .name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .title {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 15px;
        }
        
        .card-body {
            padding: 25px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .info-item i {
            width: 30px;
            color: #3498db;
            font-size: 1.1rem;
        }
        
        .info-text {
            flex: 1;
        }
        
        .info-text p:first-child {
            font-weight: 600;
            color: #333;
        }
        
        .info-text p:last-child {
            color: #666;
            font-size: 0.9rem;
        }
        
        .qr-section {
            text-align: center;
            padding: 15px 25px 25px;
            border-top: 1px solid #eee;
        }
        
        .qr-code {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .qr-text {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }
        
        .portfolio-btn {
            display: inline-block;
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 500;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        
        .portfolio-btn:hover {
            background-color: #3498db;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .social-links a {
            color: #2c3e50;
            font-size: 1.2rem;
            transition: color 0.3s;
        }
        
        .social-links a:hover {
            color: #3498db;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .visiting-card {
                box-shadow: none;
                max-width: 100%;
                height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="visiting-card">
        <div class="card-header">
            <img src="C:\Users\Kiran\Desktop\my work\Gaurav_portfolio\assets\Screenshot 2025-04-30 113051.png" alt="Gaurav Jaiswal" class="profile-img">
            <h1 class="name">Gaurav Milind Jaiswal</h1>
            <p class="title">Law Student</p>
        </div>
        
        <div class="card-body">
            <div class="info-item">
                <i class="fas fa-university"></i>
                <div class="info-text">
                    <p>Oriental College of Law</p>
                    <p>BLS LLB (5-Year Course)</p>
                </div>
            </div>
            
            <div class="info-item">
                <i class="fas fa-map-marker-alt"></i>
                <div class="info-text">
                    <p>Location</p>
                    <p>Mumbai, India</p>
                </div>
            </div>
            
            <div class="info-item">
                <i class="fas fa-envelope"></i>
                <div class="info-text">
                    <p>Email</p>
                    <p>gaurav.jaiswal@example.com</p>
                </div>
            </div>
            
            <div class="info-item">
                <i class="fas fa-phone"></i>
                <div class="info-text">
                    <p>Phone</p>
                    <p>+91 9321433584</p>
                </div>
            </div>
        </div>
        
        <div class="qr-section">
            <a href="https://neelbelsare.github.io/Gaurav_portfolio/" target="_blank" id="qrLink">
                <div class="qr-code" id="qrCode"></div>
            </a>
            <p class="qr-text">Scan or click the QR code to visit my portfolio</p>
            <a href="https://neelbelsare.github.io/Gaurav_portfolio/" target="_blank" class="portfolio-btn">
                Click to Visit My Portfolio
            </a>
            
            <div class="social-links">
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>

    <script>
        // Generate QR Code
        const qr = qrcode(0, 'L');
        qr.addData('https://neelbelsare.github.io/Gaurav_portfolio/');
        qr.make();
        document.getElementById('qrCode').innerHTML = qr.createImgTag(4, 0);
        
        // Make QR code image responsive
        const qrImg = document.querySelector('#qrCode img');
        if (qrImg) {
            qrImg.style.width = '100%';
            qrImg.style.height = '100%';
        }
        
        // Make entire QR code container clickable
        document.getElementById('qrLink').addEventListener('click', function(e) {
            // Link is already handled by the anchor tag
        });
        
        // Print functionality (optional)
        document.body.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'p') {
                e.preventDefault();
                window.print();
            }
        });
    </script>
</body>
</html>
